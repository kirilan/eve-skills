# The Windows support in this package was written on Linux: every Windows branch is covered by
# tests that inject the platform (a fake msvcrt backend, a forced `paths.is_windows`), which proves
# our own logic and nothing about the OS. This workflow is where that gap closes - the same suite
# runs on a real windows-latest runner, so an import-time `fcntl`, a byte-range lock that never
# unlocks, or a rename that trips over Windows file sharing fails here rather than on a user's
# machine.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  # write only so a failing leg can post its own output as a commit comment (see that step): job
  # logs are admin-only, and a red matrix nobody can read is a matrix nobody acts on.
  contents: write

jobs:
  suite:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a Windows-only failure must not hide a Linux-only one, or the reverse
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]   # the floor `requires-python` promises, and the newest we develop on
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # The runtime has no dependencies; setuptools and build are what the packaging tier needs to
      # produce the real wheel and sdist it inspects. Without them those tests skip, and a skipped
      # packaging tier is exactly the thing this matrix exists to catch.
      - name: Install the packaging tier's build backend
        run: python -m pip install --upgrade pip "setuptools>=77" build

      # `shell: bash` on both runners (Git Bash ships on windows-latest) so one script serves both
      # platforms, and the output is captured as well as printed: the reporting step below needs it.
      - name: Run the suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee suite-output.txt

      # Job logs need repository admin rights, so a maintainer without them - or any tool acting for
      # one - cannot see WHY a leg failed. A commit comment is readable by anyone who can read the
      # repository, which turns a red matrix into something diagnosable instead of a guess.
      - name: Report the failure where it can be read
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - "$GITHUB_SHA" "${{ matrix.os }}" "${{ matrix.python }}" <<'PY'
          import json, os, sys, urllib.request
          sha, os_name, python = sys.argv[1:4]
          try:
              tail = open("suite-output.txt", encoding="utf-8", errors="replace").read()[-40000:]
          except OSError as err:
              tail = f"(no suite output captured: {err})"
          body = (f"### `tests` failed on {os_name} / Python {python}\n\n"
                  f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n```\n{tail}\n```\n")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/comments",
              data=json.dumps({"body": body}).encode(),
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "eve-skills-ci"},
              method="POST")
          with urllib.request.urlopen(request, timeout=30) as answer:
              print("posted", answer.status)
          PY

      # Proves the console script and the module entry point agree once actually installed, on both
      # platforms' script directories (bin vs Scripts) - the packaging tests assert that layout,
      # this asserts it runs.
      - name: Install and smoke the entry points
        run: |
          python -m pip install .
          eve-skills --version
          python -m eve_skills --version

      # Read-only, offline, no credentials. A runner has never logged in, so `doctor` legitimately
      # exits 1 (no client id, no character): accept that, and fail on anything else - a traceback,
      # an unhandled platform branch, or a crash resolving the profile directories.
      - name: doctor on a machine with no login
        run: python -c "import sys; from eve_skills.cli import main; code = main(['doctor']); sys.exit(0 if code in (0, 1) else 'doctor exited %r' % code)"
